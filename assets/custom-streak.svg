<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    svg {
            background-color: transparent;
          }
          .card-bg {
            fill: #0d1117;
            stroke: #30363d;
            stroke-width: 1px;
          }
          .title {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 16px;
            fill: #58a6ff;
            animation: fadeIn 0.8s ease-in-out;
          }
          .text-main {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px;
            fill: #c9d1d9;
          }
          .text-mute {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 11px;
            fill: #8b949e;
          }
          .mono {
            font-family: "JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
          }
          .bold {
            font-weight: 700;
          }
          .fade-in {
            animation: fadeIn 0.6s ease-in-out forwards;
          }
          .grow-bar {
            transform-origin: left;
            animation: scaleX 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
          }
          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
          @keyframes scaleX {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
          }
  </style>
  <!-- Card Container -->
  <rect class="card-bg" x="0.5" y="0.5" width="494" height="194" rx="8" />
  
  <!-- Header Title -->
  <g transform="translate(25, 35)">
    <text class="title" x="0" y="5">GitHub Streak Statistics</text>
  </g>
  
  <!-- Inner Canvas -->
  <g transform="translate(25, 55)">
    
  <!-- Grid columns -->
  <g transform="translate(0, 20)">
    <!-- Column 1: Total contributions -->
    <g transform="translate(10, 0)">
      <text class="text-mute bold" x="65" y="10" text-anchor="middle">Total Contributions</text>
      <text class="title bold mono" x="65" y="45" font-size="28px" fill="#c9d1d9" text-anchor="middle">
        105
      </text>
      <text class="text-mute mono" x="65" y="75" text-anchor="middle" font-size="9px">
        Jun 1, 2026 - Present
      </text>
    </g>
    
    <!-- Divider -->
    <line x1="160" y1="0" x2="160" y2="90" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Column 2: Current Streak -->
    <g transform="translate(160, 0)">
      <svg class="fade-in" x="25" y="-12" viewBox="0 0 16 16" width="22" height="22">
        <path d="M8 0c-.2 0-.4 0-.6.1C5.1 1.5 3 3.9 3 6.5A4.5 4.5 0 007.5 11c2.5 0 4.5-2 4.5-4.5 0-3.3-2.5-5.9-4-6.5zm-.2 8.7c-.8 0-1.5-.7-1.5-1.5 0-.7.4-1.2 1-1.4v.9c0 .3.2.5.5.5.3 0 .5-.2.5-.5v-1.8c.8.3 1.5 1.1 1.5 2.1 0 .9-.8 1.7-2 1.7z" fill="#f0883e"/>
      </svg>
      <text class="text-mute bold" x="70" y="10" text-anchor="middle" fill="#f0883e">Current Streak</text>
      <text class="title bold mono" x="70" y="45" font-size="28px" fill="#f0883e" text-anchor="middle">
        8 <tspan font-size="14px" font-weight="normal">days</tspan>
      </text>
      <text class="text-mute mono" x="70" y="75" text-anchor="middle" font-size="9px">
        Jun 27, 2026 - Jul 4, 2026
      </text>
    </g>
    
    <!-- Divider -->
    <line x1="315" y1="0" x2="315" y2="90" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Column 3: Longest Streak -->
    <g transform="translate(315, 0)">
      <text class="text-mute bold" x="65" y="10" text-anchor="middle">Longest Streak</text>
      <text class="title bold mono" x="65" y="45" font-size="28px" fill="#c9d1d9" text-anchor="middle">
        8 <tspan font-size="14px" font-weight="normal">days</tspan>
      </text>
      <text class="text-mute mono" x="65" y="75" text-anchor="middle" font-size="9px">
        Jun 5, 2026 - Jun 12, 2026
      </text>
    </g>
  </g>
  
  </g>
</svg>